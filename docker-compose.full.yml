version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: movies-postgres
    environment:
      POSTGRES_DB: movies_db
      POSTGRES_USER: movies_user
      POSTGRES_PASSWORD: movies_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movies_user -d movies_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - movies-network

  movies-app:
    build: .
    container_name: movies-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/movies_db
      SPRING_DATASOURCE_USERNAME: movies_user
      SPRING_DATASOURCE_PASSWORD: movies_password
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - movies-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: movies-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@movies.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - movies-network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  movies-network:
    driver: bridge