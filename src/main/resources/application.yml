server:
  port: 8090
  servlet:
    context-path: /api

spring:
  application:
    name: movies-platform
  
  datasource:
    url: jdbc:postgresql://localhost:5432/movies_db
    username: movies_user
    password: movies_password
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    defer-datasource-initialization: true
    
  sql:
    init:
      mode: always
      
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  level:
    com.imdb.movies: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

app:
  csv:
    import:
      batch-size: 1000
      movies-file: classpath:data/movies.csv
      ratings-file: classpath:data/ratings.csv